  <text x="480" y="522" text-anchor="middle" font-size="17" font-weight="500" fill="#4e5968">세션이 전송 중이면 다른 스레드는 버퍼에 넣고 바로 반환 · 전송 10초 또는 버퍼 512KB를 넘으면 연결 종료</text>
