<text x="48" y="102" font-size="20" font-weight="700" fill="#191f28" text-anchor="start">바로 다시 시도</text>
<text x="48" y="176" font-size="17" font-weight="500" fill="#8b95a1" text-anchor="start">같은 1~3초 안에서 세 번 모두 실패</text>
