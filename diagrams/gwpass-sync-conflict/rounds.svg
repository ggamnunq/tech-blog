<circle cx="372" cy="134" r="9" fill="#ef5350"/>
<rect x="24" y="214" width="912" height="134" rx="18" fill="#fff"/>
<text x="48" y="252" font-size="20" font-weight="700" fill="#191f28" text-anchor="start">기다렸다 다시 시도</text>
<text x="48" y="326" font-size="17" font-weight="500" fill="#8b95a1" text-anchor="start">오류 구간은 벗어나지만 기다리는 동안 스레드가 놂</text>
